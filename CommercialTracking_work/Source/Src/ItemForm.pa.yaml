Screens:
  ItemForm:
    Properties:
      Fill: =RGBA(255, 255, 255, 1)
      LoadingSpinnerColor: =gblColorPrimary
      OnVisible: =If(IsBlank(gblHistoryRecordId), Notify("Select a package from History before opening the full editor.", NotificationType.Warning); Navigate(History, ScreenTransition.None))
    Children:
      - conItemFormToolbar:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Fill: =gblColorCanvas
            Height: =56
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutGap: =12
            PaddingLeft: =16
            PaddingRight: =16
            Width: =Parent.Width
          Children:
            - lblItemFormTitle:
                Control: FluentV8/Label@1.8.6
                Properties:
                  FillPortions: =1
                  FontSize: =18
                  FontWeight: =FontWeight.Semibold
                  Text: =If(IsBlank(gblHistoryRecordId), "Package Editor", "Package Editor | " & Coalesce(LookUp(Tracking, ID = gblHistoryRecordId).Title, "Selected package"))
            - icnItemFormHelp:
                Control: Classic/Icon@2.5.0
                Properties:
                  AccessibleLabel: ="Open help for editing package records"
                  Color: =gblColorPrimary
                  Height: =28
                  Icon: =Icon.Help
                  OnSelect: =Set(gblHelpTopic, "ItemForm"); Navigate(Help, ScreenTransition.Fade)
                  TabIndex: =0
                  Tooltip: ="Package editor help"
                  Width: =28
            - btnSaveItemForm:
                Control: FluentV8/Button@1.5.13
                Properties:
                  AccessibleLabel: ="Save all package fields"
                  BasePaletteColor: =gblColorSuccess
                  DisplayMode: =If(Form1.Valid, DisplayMode.Edit, DisplayMode.Disabled)
                  OnSelect: =SubmitForm(Form1)
                  Text: ="Save"
            - btnCancelItemForm:
                Control: FluentV8/Button@1.5.13
                Properties:
                  AccessibleLabel: ="Cancel package editing and return to History"
                  BasePaletteColor: =gblColorNeutral
                  OnSelect: =ResetForm(Form1); Navigate(History, ScreenTransition.Fade)
                  Text: ="Cancel"
      - Form1:
          Control: Form@2.4.4
          Variant: Classic
          Layout: Vertical
          Properties:
            BorderColor: =RGBA(243, 242, 241, 1)
            DataSource: =Tracking
            DefaultMode: =FormMode.Edit
            Height: =Parent.Height - Self.Y
            Item: =LookUp(Tracking, ID = gblHistoryRecordId)
            OnFailure: |-
              =Notify("The package could not be saved: " & Form1.Error, NotificationType.Error)
            OnSuccess: =Notify("Package details saved.", NotificationType.Success); Refresh(Tracking); Navigate(History, ScreenTransition.Fade)
            Width: =Parent.Width
            Y: =56
          Children:
            - Title_DataCard1:
                Control: TypedDataCard@1.0.7
                Variant: PcfCoreTextualEditCard
                IsLocked: true
                Properties:
                  BorderColor: =RGBA(243, 242, 241, 1)
                  DataField: ="Title"
                  Default: =ThisItem.Title
                  DisplayName: =DataSourceInfo([@Tracking],DataSourceInfo.DisplayName,Title)
                  MaxLength: =DataSourceInfo([@Tracking], DataSourceInfo.MaxLength, Title)
                  Required: =false
                  Update: =DataCardValue1.Value
                  Width: =1365
                  X: =0
                  Y: =0
                Children:
                  - DataCardKey1:
                      Control: FluentV8/Label@1.8.6
                      MetadataKey: FieldName
                      Properties:
                        AutoHeight: =true
                        FontSize: =9
                        Height: =22
                        Text: =Parent.DisplayName
                        Tooltip: =Parent.DisplayName
                        VerticalAlignment: =VerticalAlign.Bottom
                        Width: =Parent.Width - 48
                        X: =24
                        Y: =10
                  - DataCardValue1:
                      Control: FluentV8/TextBox@1.7.2
                      MetadataKey: FieldValue
                      Properties:
                        AccessibleLabel: =Parent.DisplayName
                        DisplayMode: =Parent.DisplayMode
                        Required: =Parent.Required
                        Tooltip: =Parent.DisplayName
                        Value: =Parent.Default
                        Width: =Parent.Width - 48
                        X: =24
                        Y: =DataCardKey1.Y + DataCardKey1.Height + 4
                  - ErrorMessage1:
                      Control: FluentV8/Label@1.8.6
                      MetadataKey: ErrorMessage
                      Properties:
                        AutoHeight: =true
                        Color: =Color.Red
                        FontSize: =9
                        Height: =30
                        Text: =Parent.Error
                        Tooltip: =Parent.Error
                        Visible: =And(!IsBlank(Parent.Error), Parent.DisplayMode=DisplayMode.Edit)
                        Width: =Parent.Width - 48
                        X: =24
                        Y: =DataCardValue1.Y + DataCardValue1.Height
                  - StarVisible1:
                      Control: FluentV8/Label@1.8.6
                      MetadataKey: FieldRequired
                      Properties:
                        Alignment: =Align.Center
                        Height: =30
                        Text: ="*"
                        Visible: =And(Parent.Required, Parent.DisplayMode=DisplayMode.Edit)
                        Width: =30
                        Y: =DataCardKey1.Y
            - Carrier_DataCard1:
