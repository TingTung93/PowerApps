Screens:
  PackingList:
    Properties:
      Fill: =If(gblPackingListPrintMode, RGBA(255, 255, 255, 1), RGBA(243, 244, 246, 1))
      Height: =1056
      OnVisible: |
        =Set(gblPackingListPrintMode, false);
        Set(gblPackingListPrintPending, false);
        Set(gblPackingListResetChrome, false);
        ClearCollect(
            colPackingList,
            If(
                gblManifestMode = "Recipient",
                Sort(
                    Filter(
                        Tracking,
                        field_4 = gblRecipient &&
                        (
                            field_3 = "Ready for Pickup" ||
                            field_3 = "Arrived on Dock" ||
                            field_3 = "Picked Up"
                        )
                    ),
                    field_6,
                    SortOrder.Descending
                ),
                Sort(
                    Filter(
                        Tracking,
                        ID in Filter(
                            colRecentScans,
                            Direction = "Inbound" && !IsBlank(TrackingId)
                        ).TrackingId
                    ),
                    field_6,
                    SortOrder.Ascending
                )
            )
        )
      Width: =816
    Children:
      - conPackingToolbar:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Fill: =RGBA(255, 255, 255, 1)
            FillPortions: =0
            Height: =52
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutGap: =8
            LayoutMinHeight: =52
            PaddingBottom: =6
            PaddingLeft: =8
            PaddingRight: =8
            PaddingTop: =6
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            RadiusTopLeft: =8
            RadiusTopRight: =8
            Visible: =Not(gblPackingListPrintMode)
            Width: =Min(816, Parent.Width - 24)
            X: =Max(12, (Parent.Width - Self.Width) / 2)
            Y: =12
          Children:
            - btnBackToLedger:
                Control: FluentV8/Button@1.5.13
                Properties:
                  AccessibleLabel: ="Return to the package scanner"
                  LayoutMinHeight: =36
                  OnSelect: =Navigate(LedgerScreen, ScreenTransition.Fade)
                  Text: ="Back to Scanner"
            - btnPrintPackingList:
                Control: FluentV8/Button@1.5.13
                Properties:
                  AccessibleLabel: ="Print or save this customer packing list"
                  DisplayMode: =If(IsEmpty(colPackingList), DisplayMode.Disabled, DisplayMode.Edit)
                  LayoutMinHeight: =36
                  OnSelect: =Set(gblPackingListPrintMode, true); Set(gblPackingListPrintPending, false); Set(gblPackingListPrintPending, true)
                  Text: ="Print / Save PDF"
            - btnRefreshPackingList:
                Control: FluentV8/Button@1.5.13
                Properties:
                  AccessibleLabel: ="Refresh package data for this packing list"
                  LayoutMinHeight: =36
                  OnSelect: |
                    =Refresh(Tracking);
                    ClearCollect(
                        colPackingList,
                        If(
                            gblManifestMode = "Recipient",
                            Sort(
                                Filter(
                                    Tracking,
                                    field_4 = gblRecipient &&
                                    (
                                        field_3 = "Ready for Pickup" ||
                                        field_3 = "Arrived on Dock" ||
                                        field_3 = "Picked Up"
                                    )
                                ),
                                field_6,
                                SortOrder.Descending
                            ),
                            Sort(
                                Filter(
                                    Tracking,
                                    ID in Filter(
                                        colRecentScans,
                                        Direction = "Inbound" && !IsBlank(TrackingId)
                                    ).TrackingId
                                ),
                                field_6,
                                SortOrder.Ascending
                            )
                        )
                    )
                  Text: ="Refresh"
      - conPackingList:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Fill: =RGBA(255, 255, 255, 1)
            Height: =Parent.Height - If(gblPackingListPrintMode, 0, conPackingToolbar.Y + conPackingToolbar.Height + 12)
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =If(gblPackingListPrintMode, 4, 6)
            PaddingBottom: =If(gblPackingListPrintMode, 6, 10)
            PaddingLeft: =If(gblPackingListPrintMode, 6, 10)
            PaddingRight: =If(gblPackingListPrintMode, 6, 10)
            PaddingTop: =If(gblPackingListPrintMode, 6, 10)
            RadiusBottomLeft: =If(gblPackingListPrintMode, 0, 8)
            RadiusBottomRight: =If(gblPackingListPrintMode, 0, 8)
            RadiusTopLeft: =If(gblPackingListPrintMode, 0, 8)
            RadiusTopRight: =If(gblPackingListPrintMode, 0, 8)
            Width: '=816 '
            X: =If(gblPackingListPrintMode, 0, Max(0, (Parent.Width - 816) / 2))
            Y: =If(gblPackingListPrintMode, 0, conPackingToolbar.Y + conPackingToolbar.Height + 12)
          Children:
            - Container2:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Height: =If(gblPackingListPrintMode, 70, 92)
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =6
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  LayoutWrap: =true
                Children:
                  - htmlManifestHeader:
                      Control: HtmlViewer@2.1.0
                      Properties:
                        AutoHeight: =true
                        DisabledBorderColor: =RGBA(200, 198, 196, 1)
                        FillPortions: =1
                        Font: =Font.'Segoe UI'
                        Height: =If(gblPackingListPrintMode, 70, 92)
                        HtmlText: |
                          ="<div style='border:1px solid #d2d0ce; border-radius:6px; background:linear-gradient(135deg,#f8fbff 0%,#eef6ff 100%); padding:5px 5px; color:#201f1e; overflow:hidden;'>
                            <div style='font-size:12px; line-height:1.1; font-weight:700; text-align:left;'>" & If(gblManifestMode = "Recipient", "High-Value Recipient Custody Manifest", "Inbound Receiving Manifest") & "</div>
                            <div style='margin-top:4px; font-size:12px; line-height:1.15; font-weight:600; color:#0f548c; text-align:left; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;'>" &
                            If(
                                gblManifestMode = "Recipient",
                                "Recipient: " & Substitute(Substitute(Substitute(Coalesce(gblRecipient, "Not selected"), "&", "&amp;"), "<", "&lt;"), ">", "&gt;"),
                                IsBlank(gblReceivingLocation),
                                "Receiving location not selected",
                                "Location: " & Substitute(Substitute(Substitute(gblReceivingLocation, "&", "&amp;"), "<", "&lt;"), ">", "&gt;")
                            ) &
                            "</div>
                            <table style='width:100%; margin-top:3px; border-collapse:separate; border-spacing:3px 0; table-layout:fixed;'>
                              <tr>
                                <td style='width:37%; vertical-align:top; background-color:#ffffff; border:1px solid #c7e0f4; border-radius:5px; padding:3px 6px;'>
                                  <div style='font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:#605e5c;'>Prepared</div>
                                  <div style='font-size:12px; line-height:1.15; font-weight:700; color:#201f1e; margin-top:2px;'>" & Text(gblManifestPreparedAt, "mm/dd/yyyy hh:mm AM/PM") & "</div>
                                </td>
                                <td style='width:22%; vertical-align:top; background-color:#ffffff; border:1px solid #c7e0f4; border-radius:5px; padding:3px 6px; text-align:center;'>
                                  <div style='font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:#605e5c;'>Packages</div>
                                  <div style='font-size:15px; line-height:1.05; font-weight:700; color:#0f548c; margin-top:2px;'>" & CountRows(colPackingList) & "</div>
                                </td>
                                <td style='width:41%; vertical-align:top; background-color:#ffffff; border:1px solid #c7e0f4; border-radius:5px; padding:3px 6px;'>
                                  <div style='font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:#605e5c;'>Use</div>
                                  <div style='font-size:12px; line-height:1.15; font-weight:700; color:#201f1e; margin-top:2px;'>" & If(gblManifestMode = "Recipient", "Outbound custody transfer", "Inbound receiving record") & "</div>
                                </td>
                              </tr>
                            </table>" &
                            If(
                                gblPackingListPrintMode,
                                "",
                                "<div style='margin-top:8px; font-size:12px; line-height:1.2; color:#605e5c; text-align:left;'>Print-first view for fast accountability. Scan the local barcode, review status, then capture the receiving signature below.</div>"
                            ) &
                            "</div>"
                        Width: =Parent.Width - Parent.PaddingLeft - Parent.PaddingRight
                  - lblEmptyManifest:
                      Control: FluentV8/Label@1.8.6
                      Properties:
                        AutoHeight: =true
                        FontSize: =16
                        Text: =If(gblManifestMode = "Recipient", "No active or picked-up packages were found for this recipient.", "No inbound packages are available in the current scan session.")
                        Visible: =IsEmpty(colPackingList)
                        X: =40
                        Y: =40
            - htmlPackingManifest:
                Control: HtmlViewer@2.1.0
                Properties:
                  DisabledBorderColor: =RGBA(200, 198, 196, 1)
                  FillPortions: =4
                  Font: =Font.'Segoe UI'
                  Height: |
                    =Max(
                        240,
                        conPackingList.Height -
                        conPackingList.PaddingTop -
                        conPackingList.PaddingBottom -
                        Container2.Height -
                        htmlPackingSignature.Height -
                        If(lblEmptyManifest.Visible, lblEmptyManifest.Height + 30, 20)
                    )
                  HtmlText: |-
                    =If(
                      CountRows(colPackingList) > 20,
                      With(
                        {
                          _itemCount: CountRows(colPackingList),
                          _rowsPerColumn: RoundUp(CountRows(colPackingList) / 4, 0)
                        },
                        "<div style='border:1px solid #d2d0ce; background:#fff; overflow:hidden; font-family:Segoe UI,Arial,sans-serif; color:#201f1e;'>
                          <div style='padding:2px 4px; border-bottom:1px solid #d2d0ce; background:#f3f2f1; font-size:7px; font-weight:700; text-transform:uppercase;'>High-density manifest index &mdash; " & Text(_itemCount) & " items</div>
                          <table style='width:100%; border-collapse:collapse; table-layout:fixed;'>" &
                          Concat(
                            Sequence(_rowsPerColumn) As manifestRow,
                            "<tr>" &
                            Concat(
                              Sequence(4) As manifestColumn,
                              With(
                                {
                                  _itemIndex: manifestRow.Value + ((manifestColumn.Value - 1) * _rowsPerColumn)
                                },
                                If(
                                  _itemIndex <= _itemCount,
                                  With(
                                    {
                                      _manifestItem: Last(FirstN(colPackingList, _itemIndex))
                                    },
                                    "<td style='width:25%; height:25px; padding:1px 3px; border-right:1px solid #edebe9; border-bottom:1px solid #edebe9; vertical-align:middle; overflow:hidden;'>
                                      <div style='font-size:6px; line-height:1; color:#605e5c; white-space:nowrap;'>#" & Text(_itemIndex, "000") & " &nbsp;" &
                                        Substitute(Substitute(Substitute(Coalesce(_manifestItem.field_1, "Unknown"), "&", "&amp;"), "<", "&lt;"), ">", "&gt;") & " &nbsp;&bull;&nbsp; " &
                                        Substitute(Substitute(Substitute(Coalesce(_manifestItem.field_3, "Unknown"), "&", "&amp;"), "<", "&lt;"), ">", "&gt;") &
                                      "</div>
                                      <div style='margin-top:1px; font-size:7px; line-height:1; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;'>" &
                                        Substitute(Substitute(Substitute(Coalesce(_manifestItem.Title, ""), "&", "&amp;"), "<", "&lt;"), ">", "&gt;") &
                                      "</div>
                                      <div style='margin-top:1px; font-size:5.5px; line-height:1; color:#605e5c; white-space:nowrap;'>" &
                                        Text(
                                          If(
                                            _manifestItem.field_2 = "Outbound" && Not(IsBlank(_manifestItem.SignedOutDateTime)),
                                            _manifestItem.SignedOutDateTime,
                                            _manifestItem.field_6
                                          ),
                                          "[$-en-US]mm/dd/yy hh:mm"
                                        ) &
                                      "</div>
                                    </td>"
                                  ),
                                  "<td style='width:25%; height:25px; border-right:1px solid #edebe9; border-bottom:1px solid #edebe9;'></td>"
                                )
                              )
                            ) &
                            "</tr>"
                          ) &
                          "</table>
                        </div>"
                      ),
                      "<div style='border:1px solid #d2d0ce; border-radius:8px; overflow:hidden; background-color:#ffffff;'>
                      <table style='width:100%; border-collapse:collapse; table-layout:fixed; font-family:Segoe UI, Arial, sans-serif; font-size:12px; color:#323130;'>
                        <thead>
                          <tr style='background-color:#f3f2f1;'>
                            <th style='text-align:left; padding:3px 4px; width:31%; border-bottom:1px solid #d2d0ce; font-size:9px; text-transform:uppercase; letter-spacing:.03em;'>Tracking</th>
                            <th style='text-align:center; padding:3px 2px; width:18%; border-bottom:1px solid #d2d0ce; font-size:9px; text-transform:uppercase;'>Barcode</th>
                            <th style='text-align:left; padding:3px 4px; width:19%; border-bottom:1px solid #d2d0ce; font-size:9px; text-transform:uppercase; letter-spacing:.03em;'>Custody</th>
                            <th style='text-align:left; padding:3px 4px; width:12%; border-bottom:1px solid #d2d0ce; font-size:9px; text-transform:uppercase; letter-spacing:.03em;'>Carrier</th>
                            <th style='text-align:left; padding:3px 4px; width:20%; border-bottom:1px solid #d2d0ce; font-size:9px; text-transform:uppercase; letter-spacing:.03em;'>Recorded</th>
                          </tr>
                        </thead>
                        <tbody>" & If(
                        IsEmpty(colPackingList),
                        "<tr><td colspan='5' style='padding:12px 8px; color:#605e5c;'>" & If(gblManifestMode = "Recipient", "No packages were found for this recipient.", "No inbound packages are available in the current scan session.") & "</td></tr>",
                        Concat(
                            colPackingList,
                            "<tr>" & "<td style='padding:3px 4px; border-bottom:1px solid #edebe9; vertical-align:middle;'><div style='font-size:9px; line-height:1.05; font-weight:700; color:#201f1e; word-break:break-word;'>" & Substitute(
                                Substitute(
                                    Substitute(
                                        Coalesce(
                                            Title,
                                            ""
                                        ),
                                        "&",
                                        "&amp;"
                                    ),
                                    "<",
                                    "&lt;"
                                ),
                                ">",
                                "&gt;"
                            ) & "</div></td>" & "<td style='padding:2px; border-bottom:1px solid #edebe9; text-align:center; vertical-align:middle;'>" &
                            With(
                                {
                                    _barcodeText: "*PKGID-" & Text(ID) & "*",
                                    _barcodeAlphabet: "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ-. $/+%*",
                                    _barcodePatterns: Table(
                                        {Value:"101001101101"},{Value:"110100101011"},{Value:"101100101011"},{Value:"110110010101"},{Value:"101001101011"},
                                        {Value:"110100110101"},{Value:"101100110101"},{Value:"101001011011"},{Value:"110100101101"},{Value:"101100101101"},
                                        {Value:"110101001011"},{Value:"101101001011"},{Value:"110110100101"},{Value:"101011001011"},{Value:"110101100101"},
                                        {Value:"101101100101"},{Value:"101010011011"},{Value:"110101001101"},{Value:"101101001101"},{Value:"101011001101"},
                                        {Value:"110101010011"},{Value:"101101010011"},{Value:"110110101001"},{Value:"101011010011"},{Value:"110101101001"},
                                        {Value:"101101101001"},{Value:"101010110011"},{Value:"110101011001"},{Value:"101101011001"},{Value:"101011011001"},
                                        {Value:"110010101011"},{Value:"100110101011"},{Value:"110011010101"},{Value:"100101101011"},{Value:"110010110101"},
                                        {Value:"100110110101"},{Value:"100101011011"},{Value:"110010101101"},{Value:"100110101101"},{Value:"100100100101"},
                                        {Value:"100100101001"},{Value:"100101001001"},{Value:"101001001001"},{Value:"100101101101"}
                                    )
                                },
                                With(
                                    {
                                        _barcodeSvg:
                                            "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 " & Text(Len(_barcodeText) * 12) & " 30' preserveAspectRatio='none' shape-rendering='crispEdges'>" &
                                            "<rect width='100%' height='100%' fill='white'/>" &
                                            Concat(
                                                Sequence(Len(_barcodeText)) As barcodeCharacter,
                                                With(
                                                    {
                                                        _pattern: Last(
                                                            FirstN(
                                                                _barcodePatterns,
                                                                Find(
                                                                    Mid(_barcodeText, barcodeCharacter.Value, 1),
                                                                    _barcodeAlphabet
                                                                )
                                                            )
                                                        ).Value
                                                    },
                                                    Concat(
                                                        Sequence(12) As barcodeModule,
                                                        If(
                                                            Mid(_pattern, barcodeModule.Value, 1) = "1",
                                                            "<rect x='" & Text((barcodeCharacter.Value - 1) * 12 + barcodeModule.Value - 1) & "' y='0' width='1' height='30' fill='black'/>",
                                                            ""
                                                        )
                                                    )
                                                )
                                            ) &
                                            "</svg>"
                                    },
                                    "<img alt='Code 39 package reference barcode for record " & Text(ID) &
                                    "' src='data:image/svg+xml;utf8," & EncodeUrl(_barcodeSvg) &
                                    "' style='display:block; width:100%; height:28px; object-fit:fill; background:#fff;' />"
                                )
                            ) &
                            "</td><td style='padding:3px 4px; border-bottom:1px solid #edebe9; vertical-align:middle; word-break:break-word;'><span style='display:inline-block; padding:1px 4px; border-radius:6px; font-size:9px; line-height:1.05; font-weight:700; background-color:" & If(
                                field_2 = "Outbound",
                                "#fde7e9; color:#a4262c",
                                "#dff6dd; color:#107c10"
                            ) & ";'>" & Substitute(
                                Substitute(
                                    Substitute(
                                        Upper(
                                            Coalesce(
                                                field_2,
                                                "Unknown"
                                            )
                                        ),
                                        "&",
                                        "&amp;"
                                    ),
                                    "<",
                                    "&lt;"
                                ),
                                ">",
                                "&gt;"
                            ) & "</span><div style='margin-top:2px; font-size:9px; line-height:1.05; color:#605e5c;'>" & Substitute(
                                Substitute(
                                    Substitute(
                                        Coalesce(
                                            field_3,
                                            "Unknown"
                                        ),
                                        "&",
                                        "&amp;"
                                    ),
                                    "<",
                                    "&lt;"
                                ),
                                ">",
                                "&gt;"
                            ) & "</div></td>" & "<td style='padding:3px 4px; border-bottom:1px solid #edebe9; vertical-align:middle;'><div style='font-size:9px; line-height:1.05; font-weight:600; color:#323130; word-break:break-word;'>" & Substitute(
                                Substitute(
                                    Substitute(
                                        Coalesce(
                                            field_1,
                                            "Unknown"
                                        ),
                                        "&",
                                        "&amp;"
                                    ),
                                    "<",
                                    "&lt;"
                                ),
                                ">",
                                "&gt;"
                            ) & "</div></td>" & "<td style='padding:3px 4px; border-bottom:1px solid #edebe9; vertical-align:middle;'><div style='font-size:9px; line-height:1.05; font-weight:600; color:#201f1e; white-space:nowrap;'>" & Text(
                                If(
                                    field_2 = "Outbound" && Not(IsBlank(SignedOutDateTime)),
                                    SignedOutDateTime,
                                    field_6
                                ),
                                "[$-en-US]mm/dd/yy hh:mm"
                            ) & "</div></td>" & "</tr>"
                        )
                    ) & "</tbody>
                      </table>
                    </div>"
                    )
                  LayoutMinHeight: =240
                  Width: =Parent.Width - Parent.PaddingLeft - Parent.PaddingRight
            - conPackingSignature:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutMinHeight: =If(gblPackingListPrintMode, 105, 140)
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                Children:
                  - htmlPackingSignature:
                      Control: HtmlViewer@2.1.0
                      Properties:
                        AutoHeight: =true
                        DisabledBorderColor: =RGBA(200, 198, 196, 1)
                        FillPortions: =1
                        Font: =Font.'Segoe UI'
                        Height: =If(gblPackingListPrintMode, 105, 140)
                        HtmlText: |
                          ="<div style='border:1px solid #d2d0ce; border-radius:6px; background-color:#fcfcfd; padding:6px 10px; color:#201f1e; overflow:hidden;'>
                            <div style='font-size:11px; line-height:1.05; font-weight:700; color:#201f1e;'>" & If(gblManifestMode = "Recipient", "Custody Acceptance", "Receiving Record") & "</div>
                            <div style='margin-top:2px; font-size:9px; line-height:1.1; color:#605e5c;'>" & If(gblManifestMode = "Recipient", "I accept responsibility for the high-value items listed above and confirm custody was transferred to me.", "I confirm the packages listed above were received at the stated location and recorded in the tracking ledger.") & "</div>
                            <table style='width:100%; margin-top:5px; border-collapse:separate; border-spacing:8px 0; table-layout:fixed;'>
                              <tr>
                                <td style='width:64%; vertical-align:bottom;'>
                                  <div style='font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:#605e5c;'>" & If(gblManifestMode = "Recipient", "Recipient signature", "Receiving personnel signature") & "</div>
                                  <div style='margin-top:8px; border-bottom:1px solid #323130; height:1px;'></div>
                                </td>
                                <td style='width:36%; vertical-align:bottom;'>
                                  <div style='font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:#605e5c;'>Date</div>
                                  <div style='margin-top:8px; border-bottom:1px solid #323130; height:1px;'></div>
                                </td>
                              </tr>
                            </table>
                            <table style='width:100%; margin-top:4px; border-collapse:collapse;'>
                              <tr>
                                <td style='vertical-align:bottom;'>
                                  <div style='font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:#605e5c;'>Printed name / duty phone</div>
                                  <div style='margin-top:8px; border-bottom:1px solid #323130; height:1px;'></div>
                                </td>
                              </tr>
                            </table>
                          </div>"
                        Width: =Parent.Width - Parent.PaddingLeft - Parent.PaddingRight
            - tmrPackingListPrint:
                Control: Timer@2.1.0
                Properties:
                  Duration: =250
                  OnTimerEnd: |
                    =Set(gblPackingListPrintPending, false);
                    Print();
                    Set(gblPackingListResetChrome, true)
                  Start: =gblPackingListPrintPending
                  Visible: =false
            - tmrPackingListResetChrome:
                Control: Timer@2.1.0
                Properties:
                  Duration: =1500
                  OnTimerEnd: |
                    =Set(gblPackingListResetChrome, false);
                    Set(gblPackingListPrintMode, false)
                  Start: =gblPackingListResetChrome
                  Visible: =false
