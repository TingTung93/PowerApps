Screens:
  PackingList:
    Properties:
      Fill: =RGBA(243, 244, 246, 1)
      OnVisible: |
        =ClearCollect(
            colPackingList,
            If(
                IsBlank(gblRecipient),
                Filter(Tracking, false),
                Sort(
                    Filter(
                        Tracking,
                        field_4 = gblRecipient &&
                        (
                            field_3 = "Ready for Pickup" ||
                            field_3 = "Arrived on Dock" ||
                            field_3 = "Picked Up"
                        )
                    ),
                    field_6,
                    SortOrder.Descending
                )
            )
        )
    Children:
      - conPackingList:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Fill: =RGBA(255, 255, 255, 1)
            Height: =Parent.Height
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =If(PackingList.Printing, 8, 12)
            PaddingBottom: =If(PackingList.Printing, 12, 24)
            PaddingLeft: =If(PackingList.Printing, 12, 24)
            PaddingRight: =If(PackingList.Printing, 12, 24)
            PaddingTop: =If(PackingList.Printing, 12, 24)
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            RadiusTopLeft: =8
            RadiusTopRight: =8
            Width: =If(PackingList.Printing, Min(Parent.Width, 760), Parent.Width)
          Children:
            - btnBackToLedger:
                Control: FluentV8/Button@1.5.13
                Properties:
                  AccessibleLabel: ="Return to the package scanner"
                  AlignInContainer: =AlignInContainer.Start
                  OnSelect: =Navigate(LedgerScreen, ScreenTransition.Fade)
                  Text: ="Back to Scanner"
                  Visible: =Not(PackingList.Printing)
                  X: =40
                  Y: =40
            - Container2:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  FillPortions: =0
                  Height: =If(PackingList.Printing, 84, 100)
                  LayoutAlignItems: =If(PackingList.Printing, LayoutAlignItems.Start, LayoutAlignItems.Center)
                  LayoutDirection: =If(PackingList.Printing, LayoutDirection.Vertical, LayoutDirection.Horizontal)
                  LayoutGap: =If(PackingList.Printing, 4, 8)
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  LayoutWrap: =true
                  PaddingBottom: =8
                  PaddingLeft: =8
                  PaddingRight: =8
                  PaddingTop: =8
                Children:
                  - lblPackingTitle:
                      Control: FluentV8/Label@1.8.6
                      Properties:
                        AutoHeight: =true
                        FontSize: =20
                        FontWeight: =FontWeight.Semibold
                        Text: ="Package Responsibility List"
                        X: =40
                        Y: =40
                  - lblManifestRecipient:
                      Control: FluentV8/Label@1.8.6
                      Properties:
                        AutoHeight: =true
                        FontSize: =16
                        FontWeight: =FontWeight.Semibold
                        Text: |
                          =If(
                              IsBlank(gblRecipient),
                              "No recipient selected",
                              "Recipient: " & gblRecipient
                          )
                        X: =40
                        Y: =40
                  - lblManifestMeta:
                      Control: FluentV8/Label@1.8.6
                      Properties:
                        AutoHeight: =true
                        Text: ="Prepared " & Text(gblManifestPreparedAt, "mm/dd/yyyy hh:mm AM/PM") & " | " & CountRows(colPackingList) & " active package(s)"
                        X: =40
                        Y: =40
                  - lblManifestHint_1:
                      Control: FluentV8/Label@1.8.6
                      Properties:
                        AutoHeight: =true
                        Color: =RGBA(96, 94, 92, 1)
                        Text: ="Print-first view for inbound and outbound accountability. Use the signature section below when custody is transferred."
                        Visible: =Not(PackingList.Printing)
                        X: =40
                        Y: =40
                  - lblEmptyManifest:
                      Control: FluentV8/Label@1.8.6
                      Properties:
                        AutoHeight: =true
                        Text: =If(IsBlank(gblRecipient), "Return to the scanner and choose a recipient.", "No active inbound or outbound packages were found for this recipient.")
                        Visible: =IsEmpty(colPackingList)
                        X: =40
                        Y: =40
            - htmlPackingManifest:
                Control: HtmlViewer@2.1.0
                Properties:
                  DisabledBorderColor: =RGBA(200, 198, 196, 1)
                  FillPortions: =1
                  Font: =Font.'Segoe UI'
                  Height: =Max(320, Parent.Height - 240)
                  HtmlText: |
                    ="<div style='border:1px solid #d2d0ce; border-radius:8px; overflow:hidden; background-color:#ffffff;'>
                      <table style='width:100%; border-collapse:collapse; table-layout:fixed; font-family:Segoe UI, Arial, sans-serif; font-size:12px; color:#323130;'>
                        <thead>
                          <tr style='background-color:#f3f2f1;'>
                            <th style='text-align:left; padding:8px 6px; width:24%; border-bottom:1px solid #d2d0ce;'>Tracking</th>
                            <th style='text-align:left; padding:8px 6px; width:16%; border-bottom:1px solid #d2d0ce;'>QR</th>
                            <th style='text-align:left; padding:8px 6px; width:18%; border-bottom:1px solid #d2d0ce;'>Custody</th>
                            <th style='text-align:left; padding:8px 6px; width:18%; border-bottom:1px solid #d2d0ce;'>Carrier</th>
                            <th style='text-align:left; padding:8px 6px; width:24%; border-bottom:1px solid #d2d0ce;'>Recorded</th>
                          </tr>
                        </thead>
                        <tbody>" &
                        If(
                            IsEmpty(colPackingList),
                            "<tr><td colspan='5' style='padding:12px 8px; color:#605e5c;'>No active packages are currently available for this recipient.</td></tr>",
                            Concat(
                                colPackingList,
                                "<tr>" &
                                "<td style='padding:8px 6px; border-bottom:1px solid #edebe9; font-weight:600; color:#201f1e; word-break:break-word;'>" & Substitute(Substitute(Substitute(Coalesce(Title, ""), "&", "&amp;"), "<", "&lt;"), ">", "&gt;") & "</td>" &
                                "<td style='padding:6px 4px; border-bottom:1px solid #edebe9; text-align:center;'><img alt='QR code for tracking number " & Substitute(Substitute(Substitute(Coalesce(Title, ""), "&", "&amp;"), "<", "&lt;"), ">", "&gt;") & "' src='https://api.qrserver.com/v1/create-qr-code/?size=72x72&data=" & EncodeUrl("PKG|" & Coalesce(Title, "")) & "' style='width:48px; height:48px; display:block; margin:0 auto;' /></td>" &
                                "<td style='padding:8px 6px; border-bottom:1px solid #edebe9; word-break:break-word;'>" & Substitute(Substitute(Substitute(Coalesce(field_2, "Unknown"), "&", "&amp;"), "<", "&lt;"), ">", "&gt;") & "<br/><span style='color:#605e5c; font-size:11px;'>" & Substitute(Substitute(Substitute(Coalesce(field_3, "Unknown"), "&", "&amp;"), "<", "&lt;"), ">", "&gt;") & "</span></td>" &
                                "<td style='padding:8px 6px; border-bottom:1px solid #edebe9; word-break:break-word;'>" & Substitute(Substitute(Substitute(Coalesce(field_1, "Unknown"), "&", "&amp;"), "<", "&lt;"), ">", "&gt;") & "</td>" &
                                "<td style='padding:8px 6px; border-bottom:1px solid #edebe9; white-space:nowrap;'>" & Text(If(field_2 = "Outbound" && Not(IsBlank(SignedOutDateTime)), SignedOutDateTime, field_6), "[$-en-US]mm/dd/yy hh:mm") & "</td>" &
                                "</tr>"
                            )
                        ) &
                        "</tbody>
                      </table>
                    </div>"
                  LayoutMinHeight: =320
                  Width: =If(PackingList.Printing, Min(Parent.Width - 24, 736), Parent.Width - 48)
            - conPackingSignature:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  FillPortions: =0
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =8
                  LayoutMinHeight: =130
                  PaddingBottom: =16
                  PaddingLeft: =16
                  PaddingRight: =16
                  PaddingTop: =16
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                Children:
                  - lblSignatureTitle:
                      Control: FluentV8/Label@1.8.6
                      Properties:
                        FontSize: =16
                        FontWeight: =FontWeight.Semibold
                        Text: ="Acceptance Signature"
                  - lblSignatureStatement:
                      Control: FluentV8/Label@1.8.6
                      Properties:
                        AutoHeight: =true
                        Text: ="I accept responsibility for the packages listed above and confirm they were transferred to me in the condition shown."
                  - lblSignatureLine1:
                      Control: FluentV8/Label@1.8.6
                      Properties:
                        FontSize: =14
                        Text: |
                          ="Recipient Signature: ________________________________    Date: ____________________"
                  - lblSignatureLine2:
                      Control: FluentV8/Label@1.8.6
                      Properties:
                        FontSize: =14
                        Text: |
                          ="Printed Name / Duty Phone: _________________________________________________"
            - conPackingActions:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  FillPortions: =0
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =12
                  LayoutMinHeight: =44
                  Visible: =Not(PackingList.Printing)
                Children:
                  - btnPrintPackingList:
                      Control: FluentV8/Button@1.5.13
                      Properties:
                        AccessibleLabel: ="Print or save this customer packing list"
                        DisplayMode: =If(IsEmpty(colPackingList), DisplayMode.Disabled, DisplayMode.Edit)
                        OnSelect: =Print()
                        Text: ="Print / Save PDF"
                  - btnRefreshPackingList:
                      Control: FluentV8/Button@1.5.13
                      Properties:
                        AccessibleLabel: ="Refresh package data for this packing list"
                        OnSelect: |
                          =Refresh(Tracking);
                          ClearCollect(
                              colPackingList,
                              If(
                                  IsBlank(gblRecipient),
                                  Filter(Tracking, false),
                                  Sort(
                                      Filter(
                                          Tracking,
                                          field_4 = gblRecipient &&
                                          (
                                              field_3 = "Ready for Pickup" ||
                                              field_3 = "Arrived on Dock" ||
                                              field_3 = "Picked Up"
                                          )
                                      ),
                                      field_6,
                                      SortOrder.Descending
                                  )
                              )
                          )
                        Text: ="Refresh"
