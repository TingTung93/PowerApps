Screens:
  LedgerScreen:
    Properties:
      Fill: =RGBA(255, 255, 255, 1)
      LoadingSpinnerColor: =RGBA(5, 102, 178, 1)
      OnVisible: |
        =If(IsBlank(varScanDirection), UpdateContext({varScanDirection: "Inbound"}));
        UpdateContext({varScanInProgress: false});
        If(
            varScanDirection = "Inbound" && IsBlank(gblReceivingLocation),
            SetFocus(cmbReceivingLocation),
            UpdateContext({varTriggerFocus: true})
        );
    Children:
      - audScanSuccess:
          Control: Audio@2.3.1
          Properties:
            AccessibleLabel: ="Successful scan tone"
            AutoStart: =false
            Height: =1
            Loop: =false
            Media: ="data:audio/wav;base64,"
            ShowControls: =false
            Start: =varLastScanStatus = "SUCCESS"
            Visible: =false
            Width: =1
      - audScanWarning:
          Control: Audio@2.3.1
          Properties:
            AccessibleLabel: ="Scan warning tone"
            AutoStart: =false
            Height: =1
            Loop: =false
            Media: ="data:audio/wav;base64,"
            ShowControls: =false
            Start: =varLastScanStatus = "WARNING"
            Visible: =false
            Width: =1
      - audScanError:
          Control: Audio@2.3.1
          Properties:
            AccessibleLabel: ="Scan error tone"
            AutoStart: =false
            Height: =1
            Loop: =false
            Media: ="data:audio/wav;base64,"
            ShowControls: =false
            Start: =varLastScanStatus = "ERROR"
            Visible: =false
            Width: =1
      - ScreenContainer1_2:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Fill: =RGBA(243, 244, 246, 1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutGap: =16
            LayoutWrap: =true
            PaddingBottom: =16
            PaddingLeft: =16
            PaddingRight: =16
            PaddingTop: =16
            Width: =Parent.Width
          Children:
            - LeftContainer1_2:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(255, 255, 255, 1)
                  FillPortions: =3
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =12
                  LayoutMinWidth: =400
                  PaddingBottom: =16
                  PaddingLeft: =16
                  PaddingRight: =16
                  PaddingTop: =16
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                Children:
                  - lblLedgerHeader_1:
                      Control: FluentV8/Label@1.8.6
                      Properties:
                        FontSize: =14
                        FontWeight: =FontWeight.Semibold
                        Text: ="Recent Scans (Ledger)"
                  - htmlLastScanResult:
                      Control: HtmlViewer@2.1.0
                      Properties:
                        DisabledBorderColor: =RGBA(200, 198, 196, 1)
                        FillPortions: =0
                        Font: =Font.'Segoe UI'
                        Height: =If(IsBlank(varLastScanStatus), 42, 64)
                        HtmlText: |
                          =If(
                              IsBlank(varLastScanStatus),
                              "<div style='padding:8px 10px; border:1px solid #d2d0ce; border-radius:6px; background:#ffffff; color:#605e5c; font-size:12px;'>Ready for the next scan.</div>",
                              "<div style='padding:8px 10px; border:2px solid " &
                              Switch(varLastScanStatus, "SUCCESS", "#107c10", "WARNING", "#ffaa44", "ERROR", "#a4262c", "#0f6cbd") &
                              "; border-radius:6px; background:" &
                              Switch(varLastScanStatus, "SUCCESS", "#dff6dd", "WARNING", "#fff4ce", "ERROR", "#fde7e9", "#deecf9") &
                              "; color:#201f1e;'>
                                <div style='font-size:13px; font-weight:700;'>" & varLastScanStatus & If(!IsBlank(varLastScanTracking), " | " & varLastScanTracking, "") & "</div>
                                <div style='margin-top:3px; font-size:12px;'>" & Coalesce(varLastScanMessage, "") & "</div>
                              </div>"
                          )
                        Width: =Parent.Width - Parent.PaddingLeft - Parent.PaddingRight
                  - txtSearchLedger_1:
                      Control: FluentV8/TextBox@1.7.2
                      Properties:
                        AccessibleLabel: ="Search the current scan session"
                        LayoutMinHeight: =36
                        Placeholder: ="Search tracking, carrier, recipient, location, or label details"
                  - Gallery1_2:
                      Control: Gallery@2.15.0
                      Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_pcfCore
                      Properties:
                        AccessibleLabel: ="Recent package scans in this session"
                        BorderColor: =RGBA(243, 242, 241, 1)
                        DelayItemLoading: =true
                        FocusedBorderColor: =RGBA(5, 102, 178, 1)
                        FocusedBorderThickness: =2
                        Items: |
                          =Sort(Filter(colRecentScans, txtSearchLedger_1.Value in TrackingNumber || txtSearchLedger_1.Value in ScanNotes || txtSearchLedger_1.Value in Carrier || txtSearchLedger_1.Value in Location || txtSearchLedger_1.Value in DisplayAddressee || txtSearchLedger_1.Value in DisplayAddressBlock), Timestamp, SortOrder.Descending)
                        LayoutMinHeight: =200
                        LoadingSpinner: =LoadingSpinner.Data
                        TabIndex: =0
                        TemplateSize: =190
                      Children:
                        - HtmlText1_2:
                            Control: HtmlViewer@2.1.0
                            Properties:
                              AutoHeight: =true
                              DisabledBorderColor: =RGBA(200, 198, 196, 1)
                              Font: =Font.'Segoe UI'
                              Height: =Parent.TemplateHeight
                              HtmlText: |
                                ="<div style='padding:12px 45px 12px 12px; border: 1px solid #edebe9; border-radius: 6px; background-color: #faf9f8; box-sizing: border-box;'>
                                  <div style='display:flex; justify-content:space-between; align-items:center;'>
                                    <b style='font-size:16px; color:#323130;'>" & ThisItem.TrackingNumber & "</b>
                                    <span style='font-size:11px; font-weight:bold; padding:3px 8px; border-radius:12px; background-color:" & If(ThisItem.Direction="Inbound", "#dff6dd; color:#107c10;", "#fde7e9; color:#a4262c;") & "'>" & Upper(ThisItem.Direction) & "</span>
                                  </div>
                                  <div style='font-size:13px; color:#605e5c; margin-top:6px;'>
                                    <b>Carrier:</b> " & ThisItem.Carrier & " &nbsp;&bull;&nbsp; <b>Time:</b> " & Text(ThisItem.Timestamp, "hh:mm:ss AM/PM") & "
                                  </div>
                                  <div style='font-size:13px; color:#323130; margin-top:6px;'><b>Location:</b> " & Coalesce(ThisItem.Location, "Not recorded") & "</div>" &
                                  If(!IsBlank(ThisItem.DisplayAddressee) || !IsBlank(ThisItem.DisplayAddressBlock),
                                    "<div style='margin-top:6px; font-size:13px; color:#323130;'>" &
                                      If(!IsBlank(ThisItem.DisplayAddressee), "<b>To:</b> " & ThisItem.DisplayAddressee & "<br>", "") &
                                      If(!IsBlank(ThisItem.DisplayAddressBlock), "<b>Address:</b> " & ThisItem.DisplayAddressBlock, "") &
                                    "</div>",
                                    ""
                                  ) &
                                  If(!IsBlank(ThisItem.Recipient),
                                    "<div style='margin-top:6px; font-size:13px; color:#323130;'><b>Designated recipient:</b> " & ThisItem.Recipient & "</div>",
                                    ""
                                  ) &
                                  If(!IsBlank(ThisItem.DisplayWeight) || !IsBlank(ThisItem.DisplayPkg),
                                    "<div style='margin-top:8px; display:flex; gap:10px;'>
                                      <span style='background:#e1dfdd; padding:2px 6px; border-radius:4px; font-size:11px;'><b>Weight:</b> " & Coalesce(ThisItem.DisplayWeight, "Unknown") & "</span>
                                      <span style='background:#e1dfdd; padding:2px 6px; border-radius:4px; font-size:11px;'><b>Package:</b> " & Coalesce(ThisItem.DisplayPkg, "Unknown") & "</span>
                                     </div>",
                                    ""
                                  ) &
                                  If(!IsBlank(ThisItem.ScanNotes),
                                    "<div style='margin-top:8px; font-size:11px; color:#323130; background:#ffffff; padding:6px; border:1px solid #e1dfdd; border-radius:4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;'>" & ThisItem.ScanNotes & "</div>",
                                    ""
                                  ) &
                                "</div>"
                              Size: =10.5
                              Width: =Parent.TemplateWidth - 16
                        - icnDeleteScan_2:
                            Control: Classic/Icon@2.5.0
                            Properties:
                              AccessibleLabel: ="Void this scan"
                              Color: =RGBA(164, 38, 44, 1)
                              Height: =20
                              HoverColor: =RGBA(201, 36, 43, 1)
                              Icon: =If(varPendingVoidTrackingId = ThisItem.TrackingId, Icon.Warning, Icon.Trash)
                              OnSelect: |
                                =If(
                                    IsBlank(ThisItem.TrackingId),
                                    Remove(colRecentScans, ThisItem);
                                    Notify("This older local entry had no database ID and was removed only from this session.", NotificationType.Warning),
                                    varPendingVoidTrackingId <> ThisItem.TrackingId,
                                    UpdateContext({varPendingVoidTrackingId: ThisItem.TrackingId});
                                    Notify("Select the warning icon again within 8 seconds to void this record.", NotificationType.Warning),
                                    With(
                                        {_voidRecord: LookUp(Tracking, ID = ThisItem.TrackingId)},
                                        IfError(
                                            Patch(
                                                Tracking,
                                                _voidRecord,
                                                {
                                                    field_3: "Voided"
                                                }
                                            );
                                            Remove(colRecentScans, ThisItem);
                                            UpdateContext({varPendingVoidTrackingId: Blank()});
                                            Notify("The scan was voided and retained in database history.", NotificationType.Success),
                                            Notify("The database record could not be voided: " & FirstError.Message, NotificationType.Error)
                                        )
                                    )
                                )
                              TabIndex: =0
                              Tooltip: =If(varPendingVoidTrackingId = ThisItem.TrackingId, "Select again to confirm void", "Prepare to void this scan")
                              Width: =20
                              X: =Parent.TemplateWidth - 48
                              Y: =16
            - RightContainer1_2:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(255, 255, 255, 1)
                  FillPortions: =2
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =8
                  LayoutMinWidth: =340
                  PaddingBottom: =10
                  PaddingLeft: =10
                  PaddingRight: =10
                  PaddingTop: =10
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                Children:
                  - conControlHeader:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        FillPortions: =0
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutMinHeight: =32
                      Children:
                        - lblControlHeader_1:
                            Control: FluentV8/Label@1.8.6
                            Properties:
                              FillPortions: =1
                              FontSize: =18
                              FontWeight: =FontWeight.Semibold
                              Text: ="Receive Packages"
                        - icnLedgerHelp:
                            Control: Classic/Icon@2.5.0
                            Properties:
                              AccessibleLabel: ="Open help for receiving and outbound scanning"
                              Color: =RGBA(5, 102, 178, 1)
                              Height: =28
                              Icon: =Icon.Help
                              OnSelect: =Set(gblHelpTopic, "Ledger"); Navigate(Help, ScreenTransition.Fade)
                              TabIndex: =0
                              Tooltip: ="Scanner workflow help"
                              Width: =28
                  - lblControlInstructions:
                      Control: FluentV8/Label@1.8.6
                      Properties:
                        Color: =RGBA(255, 255, 255, 1)
                        FontWeight: =FontWeight.Semibold
                        Height: =38
                        Text: =If(varScanDirection = "Inbound", "INBOUND RECEIVING | Select location and blind scan", "OUTBOUND RELEASE | Verify recipient before custody transfer")
                  - cmbReceivingLocation:
                      Control: ComboBox@0.0.51
                      Properties:
                        AccessibleLabel: ="Receiving location"
                        DefaultSelectedItems: =If(IsBlank(gblReceivingLocation), Table(), [gblReceivingLocation])
                        DisplayMode: =If(varScanInProgress, DisplayMode.Disabled, DisplayMode.Edit)
                        InputTextPlaceholder: ="Select receiving location"
                        Items: =["Main Receiving", "Loading Dock", "Mailroom", "Warehouse"]
                        LayoutMinHeight: =44
                        OnChange: |-
                          =Set(gblReceivingLocation, Coalesce(Self.Selected.Value, ""));
                          If(!IsBlank(gblReceivingLocation) && varScanDirection = "Inbound", UpdateContext({varTriggerFocus: true}))
                        SelectMultiple: =false
                  - txtRecipient:
                      Control: TextInput@0.0.54
                      Properties:
                        AccessibleLabel: ="Recipient name used for outbound release and recipient custody manifests"
                        DisplayMode: =If(varScanInProgress, DisplayMode.Disabled, DisplayMode.Edit)
                        LayoutMinHeight: =44
                        OnChange: |-
                          =Set(gblRecipient, Trim(Self.Value)); If(!IsBlank(gblRecipient) && varScanDirection = "Inbound", UpdateContext({varTriggerFocus: true}))
                        Placeholder: =If(varScanDirection = "Outbound", "Recipient expected for outbound release", "Recipient custody manifest (optional)")
                        Value: =gblRecipient
                  - txtBarcodeScanner_2:
                      Control: TextInput@0.0.54
                      Properties:
                        AccessibleLabel: =If(varScanInProgress, "Package scan is saving. Wait for the result.", If(varScanDirection = "Inbound" && IsBlank(gblReceivingLocation), "Package scanner disabled. Select a receiving location first.", "Ready to scan a package barcode or local package-reference barcode."))
                        DisplayMode: =If(varScanInProgress || (varScanDirection = "Inbound" && IsBlank(gblReceivingLocation)), DisplayMode.Disabled, DisplayMode.Edit)
                        LayoutMinHeight: =48
                        OnChange: |
                          =// 1. Capture scan immediately so the control can reset
                          UpdateContext(
                              {
                                  varScanInProgress: true,
                                  varLastScanStatus: "SAVING",
                                  varLastScanMessage: "Saving to the package ledger. Do not scan another package.",
                                  varLastScanTracking: Trim(Self.Value)
                              }
                          );
                          UpdateContext(
                              {
                                  varRawScan: Trim(
                                      Substitute(
                                          Substitute(
                                              Self.Value,
                                              Char(13),
                                              ""
                                          ),
                                          Char(10),
                                          ""
                                      )
                                  )
                              }
                          );
                          If(
                              !IsBlank(varRawScan),
                              // 2. Parse the Scan locally (No DB hits yet)
                              With(
                                  {
                                      // Compact local packing-list barcode reference
                                      _recordId: If(
                                          IsMatch(Upper(varRawScan), "^PKGID-\d+$"),
                                          Value(Substitute(Upper(varRawScan), "PKGID-", "")),
                                          Blank()
                                      ),
                                      // Extract core tracking number
                                      _trk: If(
                                          StartsWith(
                                              varRawScan,
                                              "PKG|"
                                          ),
                                          Last(
                                              Split(
                                                  varRawScan,
                                                  "|"
                                              )
                                          ).Value,
                                          StartsWith(
                                              varRawScan,
                                              "[)>"
                                          ),
                                          Coalesce(
                                              Match(
                                                  varRawScan,
                                                  "31Z(?<trk>\d{20,34})"
                                              ).trk,
                                              Match(
                                                  varRawScan,
                                                  "\d{34}"
                                              ).FullMatch,
                                              Match(
                                                  varRawScan,
                                                  "\d{22}"
                                              ).FullMatch,
                                              Match(
                                                  varRawScan,
                                                  "1Z[A-Z0-9]{16}"
                                              ).FullMatch
                                          ),
                                          varRawScan
                                      ),
                                      // Extract 2D Label Metadata (Only runs if it's a 2D label)
                                      _weight: If(
                                          StartsWith(
                                              varRawScan,
                                              "[)>"
                                          ),
                                          Match(
                                              varRawScan,
                                              "\d+(\.\d+)?(LB|KG)"
                                          ).FullMatch,
                                          Blank()
                                      ),
                                      _pkg: If(
                                          StartsWith(
                                              varRawScan,
                                              "[)>"
                                          ),
                                          Match(
                                              varRawScan,
                                              "\d+/\d+"
                                          ).FullMatch,
                                          Blank()
                                      ),
                                      _addressee: If(
                                          StartsWith(
                                              varRawScan,
                                              "[)>"
                                          ),
                                          Trim(
                                              Coalesce(
                                                  Match(
                                                      varRawScan,
                                                      "11Z(?<addr>[a-zA-Z\s\.\-]+)"
                                                  ).addr,
                                                  Match(
                                                      varRawScan,
                                                      "12Z(?<addr>[a-zA-Z\s\.\-]+)"
                                                  ).addr
                                              )
                                          ),
                                          Blank()
                                      ),
                                      _addressBlock: If(
                                          StartsWith(
                                              varRawScan,
                                              "[)>"
                                          ),
                                          Trim(
                                              Match(
                                                  varRawScan,
                                                  "(?:LB|KG)[A-Z]?(?<block>[A-Za-z0-9\s\.,\-]+?)(?:\d{3,4}Z|11Z|12Z|13Z|31Z)"
                                              ).block
                                          ),
                                          Blank()
                                      )
                                  },
                                  With(
                                      {
                                          // Robust Carrier Detection
                                          _carrier: If(
                                              // 2D Indicators
                                              "FDEG" in varRawScan || "FDEN" in varRawScan || "FX" in varRawScan,
                                              "FedEx",
                                              "UPSN" in varRawScan,
                                              "UPS",
                                              // 1D Fallbacks
                                              IsMatch(
                                                  _trk,
                                                  "^1[Zz][a-zA-Z0-9]{16}$"
                                              ),
                                              "UPS",
                                              StartsWith(
                                                  Upper(_trk),
                                                  "TBA"
                                              ) || StartsWith(
                                                  Upper(_trk),
                                                  "TBC"
                                              ) || StartsWith(
                                                  Upper(_trk),
                                                  "TBM"
                                              ),
                                              "Amazon",
                                              IsMatch(
                                                  _trk,
                                                  "^[A-Za-z]{2}\d{9}US$"
                                              ) || IsMatch(
                                                  _trk,
                                                  "^9[1-4]\d{18,22}$"
                                              ) || IsMatch(
                                                  _trk,
                                                  "^82\d{8}$"
                                              ),
                                              "USPS",
                                              IsMatch(
                                                  _trk,
                                                  "^\d{12}$"
                                              ) || IsMatch(
                                                  _trk,
                                                  "^\d{15}$"
                                              ) || IsMatch(
                                                  _trk,
                                                  "^\d{20}$"
                                              ) || IsMatch(
                                                  _trk,
                                                  "^\d{34}$"
                                              ),
                                              "FedEx",
                                              IsMatch(
                                                  _trk,
                                                  "^\d{10}$"
                                              ),
                                              "DHL",
                                              "Other"
                                          ),
                                          _notes: If(
                                              StartsWith(
                                                  varRawScan,
                                                  "PKG|"
                                              ),
                                              "Packing-list QR",
                                              StartsWith(
                                                  varRawScan,
                                                  "[)>"
                                              ),
                                              "2D Label",
                                              Blank()
                                          ),
                                          _auditEntry: Text(
                                              Now(),
                                              "[$-en-US]mm/dd/yyyy hh:mm:ss AM/PM"
                                          ) & " | " & User().FullName & " (" & User().Email & ") | Location: " & If(
                                              varScanDirection = "Inbound",
                                              gblReceivingLocation,
                                              "Outbound pickup"
                                          ) & If(
                                              !IsBlank(_recordId),
                                              " | Local packing-list barcode",
                                              StartsWith(varRawScan, "PKG|"),
                                              " | Legacy packing-list QR",
                                              StartsWith(varRawScan, "[)>"),
                                              " | 2D label",
                                              ""
                                          )
                                      },
                                      // 3. Database Execution
                                      If(
                                          IsBlank(_trk),
                                          UpdateContext({varLastScanStatus: "ERROR", varLastScanMessage: "No supported tracking number was found in the scan.", varLastScanTracking: varRawScan});
                                          Notify(
                                              "No supported tracking number was found in the scan.",
                                              NotificationType.Error
                                          ),
                                          // OUTBOUND LOGIC
                                          varScanDirection = "Outbound",
                                          With(
                                              {
                                                  // HITS DATABASE ONCE: Grabs up to 2 records to check for duplicates
                                                  _activeMatches: FirstN(
                                                      Sort(
                                                          Filter(
                                                              Tracking,
                                                              (
                                                                  (!IsBlank(_recordId) && ID = _recordId) ||
                                                                  (IsBlank(_recordId) && Title = _trk)
                                                              ) &&
                                                              (field_3 = "Ready for Pickup" || field_3 = "Arrived on Dock")
                                                          ),
                                                          ID,
                                                          SortOrder.Descending
                                                      ),
                                                      2
                                                  )
                                              },
                                              If(
                                                  CountRows(_activeMatches) > 1,
                                                  UpdateContext({varLastScanStatus: "ERROR", varLastScanMessage: "Multiple active records exist. Resolve the duplicates before pickup.", varLastScanTracking: _trk});
                                                  Notify(
                                                      "Multiple active records exist for this tracking number. Resolve the duplicate entries before pickup.",
                                                      NotificationType.Error
                                                  ),
                                                  IsEmpty(_activeMatches),
                                                  UpdateContext({varLastScanStatus: "WARNING", varLastScanMessage: "No package awaiting pickup was found.", varLastScanTracking: _trk});
                                                  Notify(
                                                      "No package awaiting pickup was found for this tracking number.",
                                                      NotificationType.Warning
                                                  ),
                                                  // Process single match
                                                  With(
                                                      {_record: First(_activeMatches)},
                                                      IfError(
                                                          Patch(
                                                              Tracking,
                                                              _record,
                                                              {
                                                                  field_2: "Outbound",
                                                                  field_3: "Picked Up",
                                                                  SignedOutDateTime: Now(),
                                                                   SignedOutBy: {
                                                                      '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedUser",
                                                                      Claims: "i:0#.f|membership|" & Lower(User().Email),
                                                                      Department: "",
                                                                      DisplayName: User().FullName,
                                                                      Email: User().Email,
                                                                      JobTitle: "",
                                                                       Picture: ""
                                                                   }
                                                              }
                                                          );
                                                          Collect(
                                                              colRecentScans,
                                                              {
                                                                  TrackingId: _record.ID,
                                                                  TrackingNumber: _record.Title,
                                                                  Recipient: _record.field_4,
                                                                  Carrier: _record.field_1,
                                                                  Location: _record.Location,
                                                                  Timestamp: Now(),
                                                                  ScanNotes: _auditEntry,
                                                                  Direction: "Outbound",
                                                                  DisplayWeight: Blank(),
                                                                  DisplayPkg: Blank(),
                                                                  DisplayAddressee: _record.field_4,
                                                                  DisplayAddressBlock: Blank()
                                                              }
                                                          );
                                                          UpdateContext({varLastScanStatus: "SUCCESS", varLastScanMessage: "Package released to " & Coalesce(_record.field_4, "the recorded recipient") & ".", varLastScanTracking: _record.Title});
                                                          Notify(
                                                              "Package picked up by " & _record.field_4 & ".",
                                                              NotificationType.Success
                                                          ),
                                                          UpdateContext({varLastScanStatus: "ERROR", varLastScanMessage: "Pickup was not saved: " & FirstError.Message, varLastScanTracking: _record.Title});
                                                          Notify(
                                                              "Pickup could not be saved: " & FirstError.Message,
                                                              NotificationType.Error
                                                          )
                                                      )
                                                  )
                                              )
                                          ),
                                          // INBOUND LOGIC
                                          IsBlank(gblReceivingLocation),
                                          SetFocus(cmbReceivingLocation);
                                          UpdateContext({varLastScanStatus: "WARNING", varLastScanMessage: "Select a receiving location before scanning.", varLastScanTracking: _trk});
                                          Notify(
                                              "Select a receiving location before scanning an inbound package.",
                                              NotificationType.Warning
                                          ),
                                          With(
                                              {
                                                  // HITS DATABASE ONCE: Grabs up to 2 records
                                                  _activeMatches: FirstN(
                                                      Sort(
                                                          Filter(
                                                              Tracking,
                                                              (
                                                                  (!IsBlank(_recordId) && ID = _recordId) ||
                                                                  (IsBlank(_recordId) && Title = _trk)
                                                              ) &&
                                                              (field_3 = "Ready for Pickup" || field_3 = "Arrived on Dock")
                                                          ),
                                                          ID,
                                                          SortOrder.Descending
                                                      ),
                                                      2
                                                  )
                                              },
                                              If(
                                                  CountRows(_activeMatches) > 1,
                                                  UpdateContext({varLastScanStatus: "ERROR", varLastScanMessage: "Multiple active records exist. Resolve the duplicates before scanning again.", varLastScanTracking: _trk});
                                                  Notify(
                                                      "This tracking number already has multiple active records. Resolve the duplicates before scanning it again.",
                                                      NotificationType.Error
                                                  ),
                                                  !IsEmpty(_activeMatches),
                                                  With(
                                                      {_record: First(_activeMatches)},
                                                      IfError(
                                                          Patch(
                                                              Tracking,
                                                              _record,
                                                              {
                                                                  Location: gblReceivingLocation,
                                                                  ReceivedAt: Coalesce(_record.ReceivedAt, _record.field_6, Now()),
                                                                  ReceivedBy: If(
                                                                      IsBlank(_record.ReceivedBy),
                                                                      {
                                                                          '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedUser",
                                                                          Claims: "i:0#.f|membership|" & Lower(User().Email),
                                                                          Department: "",
                                                                          DisplayName: User().FullName,
                                                                          Email: User().Email,
                                                                          JobTitle: "",
                                                                          Picture: ""
                                                                      },
                                                                      _record.ReceivedBy
                                                                  )
                                                              }
                                                          );
                                                          Collect(
                                                              colRecentScans,
                                                              {
                                                                  TrackingId: Blank(),
                                                                  TrackingNumber: _record.Title,
                                                                  Recipient: _record.field_4,
                                                                  Carrier: _record.field_1,
                                                                  Location: gblReceivingLocation,
                                                                  Timestamp: Now(),
                                                                  ScanNotes: _auditEntry & " | Repeat scan; existing active record retained",
                                                                  Direction: "Inbound",
                                                                  DisplayWeight: _weight,
                                                                  DisplayPkg: _pkg,
                                                                  DisplayAddressee: _addressee,
                                                                  DisplayAddressBlock: _addressBlock
                                                              }
                                                          );
                                                          UpdateContext({varLastScanStatus: "WARNING", varLastScanMessage: "Already active. The repeat scan was recorded at " & gblReceivingLocation & ".", varLastScanTracking: _record.Title});
                                                          Notify(
                                                              "Package was already active; this scan was added to its notes.",
                                                              NotificationType.Warning
                                                          ),
                                                          UpdateContext({varLastScanStatus: "ERROR", varLastScanMessage: "The repeat scan was not saved: " & FirstError.Message, varLastScanTracking: _record.Title});
                                                          Notify(
                                                              "The repeat scan could not update the package: " & FirstError.Message,
                                                              NotificationType.Error
                                                          )
                                                      )
                                                  ),
                                                  // Process new inbound
                                                  IfError(
                                                      Set(
                                                          varSavedTracking,
                                                          Patch(
                                                              Tracking,
                                                              Defaults(Tracking),
                                                              {
                                                                  Title: _trk,
                                                                  field_1: _carrier,
                                                                  field_2: "Inbound",
                                                                  field_3: "Ready for Pickup",
                                                                  field_4: Blank(),
                                                                  field_6: Now(),
                                                                  Location: gblReceivingLocation,
                                                                  ReceivedAt: Now(),
                                                                  ReceivedBy: {
                                                                      '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedUser",
                                                                      Claims: "i:0#.f|membership|" & Lower(User().Email),
                                                                      Department: "",
                                                                      DisplayName: User().FullName,
                                                                      Email: User().Email,
                                                                      JobTitle: "",
                                                                      Picture: ""
                                                                  }
                                                              }
                                                          )
                                                      );
                                                      Collect(
                                                          colRecentScans,
                                                          {
                                                              TrackingId: varSavedTracking.ID,
                                                              TrackingNumber: _trk,
                                                              Recipient: Blank(),
                                                              Carrier: _carrier,
                                                              Location: gblReceivingLocation,
                                                              Timestamp: Now(),
                                                              ScanNotes: _auditEntry,
                                                              Direction: "Inbound",
                                                              DisplayWeight: _weight,
                                                              DisplayPkg: _pkg,
                                                              DisplayAddressee: _addressee,
                                                              DisplayAddressBlock: _addressBlock
                                                          }
                                                      );
                                                      UpdateContext({varLastScanStatus: "SUCCESS", varLastScanMessage: "Package received at " & gblReceivingLocation & ".", varLastScanTracking: _trk});
                                                      Notify(
                                                          "Package received at " & gblReceivingLocation & ".",
                                                          NotificationType.Success
                                                      ),
                                                      UpdateContext({varLastScanStatus: "ERROR", varLastScanMessage: "The package was not saved: " & FirstError.Message, varLastScanTracking: _trk});
                                                      Notify(
                                                          "The package could not be saved: " & FirstError.Message,
                                                          NotificationType.Error
                                                      )
                                                  )
                                              )
                                          )
                                      )
                                  )
                              )
                          );
                          If(
                              IsBlank(varRawScan),
                              UpdateContext({varLastScanStatus: "WARNING", varLastScanMessage: "No barcode data was received.", varLastScanTracking: Blank()})
                          );
                          // 4. Clean up and refocus for the next scan immediately
                          Reset(txtBarcodeScanner_2);
                          UpdateContext({varTriggerFocus: true});
                          UpdateContext({varScanInProgress: false});
                        Placeholder: =If(varScanInProgress, "Saving—wait for a result", If(varScanDirection = "Inbound" && IsBlank(gblReceivingLocation), "Select a receiving location first", "Scan package or QR code"))
                        TriggerOutput: ='TextInputCanvas.TriggerOutput'.Keypress
                  - DirectionToggle_2:
                      Control: FluentV8/Toggle@1.6.7
                      Properties:
                        AccessibleLabel: ="Switch between inbound receiving and outbound pickup"
                        Checked: =varScanDirection = "Inbound"
                        DisplayMode: =If(varScanInProgress, DisplayMode.Disabled, DisplayMode.Edit)
                        LayoutMinHeight: =40
                        OffText: ="Outbound"
                        OnCheck: |
                          =UpdateContext({varScanDirection: "Inbound"});
                          If(IsBlank(gblReceivingLocation), SetFocus(cmbReceivingLocation), UpdateContext({varTriggerFocus: true}))
                        OnText: ="Inbound"
                        OnUncheck: |
                          =UpdateContext({varScanDirection: "Outbound"});
                          UpdateContext({varTriggerFocus: true})
                  - lblManifestHint:
                      Control: FluentV8/Label@1.8.6
                      Properties:
                        AutoHeight: =true
                        Color: =If(varScanInProgress, RGBA(5, 102, 178, 1), If(varScanDirection = "Inbound" && IsBlank(gblReceivingLocation), RGBA(184, 105, 0, 1), RGBA(96, 94, 92, 1)))
                        FontWeight: =If(varScanInProgress || (varScanDirection = "Inbound" && IsBlank(gblReceivingLocation)), FontWeight.Semibold, FontWeight.Normal)
                        Text: =If(varScanDirection = "Outbound", "Pickup mode | " & CountRows(colRecentScans) & " session scan(s)", If(IsBlank(gblReceivingLocation), "Receiving location required before scanning", "Blind receiving at " & gblReceivingLocation & " | " & CountRows(colRecentScans) & " session scan(s) | " & CountRows(Filter(colRecentScans, Direction = "Inbound" && !IsBlank(TrackingId) && (IsBlank(gblLastInboundManifestPrintedAt) || Timestamp > gblLastInboundManifestPrintedAt))) & " unprinted"))
                  - btnViewHistory:
                      Control: FluentV8/Button@1.5.13
                      Properties:
                        AccessibleLabel: ="Open package database history"
                        LayoutMinHeight: =32
                        OnSelect: =Set(gblShowUnassigned, false); Navigate(History, ScreenTransition.Fade)
                        Text: ="View Database History"
                  - btnReconcileUnassigned:
                      Control: FluentV8/Button@1.5.13
                      Properties:
                        AccessibleLabel: ="Open active packages that still need a recipient"
                        LayoutMinHeight: =32
                        OnSelect: =Set(gblShowUnassigned, true); Set(gblHistorySearchQuery, ""); Navigate(History, ScreenTransition.Fade)
                        Text: ="Reconcile Unassigned Packages"
                  - btnCreatePackingList:
                      Control: FluentV8/Button@1.5.13
                      Properties:
                        AccessibleLabel: ="Open the inbound receiving manifest for this scan session"
                        LayoutMinHeight: =32
                        DisplayMode: =If(CountRows(Filter(colRecentScans, Direction = "Inbound" && !IsBlank(TrackingId))) = 0, DisplayMode.Disabled, DisplayMode.Edit)
                        OnSelect: =Set(gblManifestMode, "Inbound"); Set(gblManifestId, "MNF-" & Text(Now(), "[$-en-US]yyyymmdd-hhnnss") & "-" & Upper(Left(Substitute(Text(GUID()), "-", ""), 6))); Set(gblManifestPreparedAt, Now()); Navigate(PackingList, ScreenTransition.Fade)
                        Text: ="Print Inbound Manifest (" & CountRows(Filter(colRecentScans, Direction = "Inbound" && !IsBlank(TrackingId))) & ")"
                  - btnCreateRecipientManifest:
                      Control: FluentV8/Button@1.5.13
                      Properties:
                        AccessibleLabel: ="Open a custody manifest for the selected recipient"
                        LayoutMinHeight: =32
                        DisplayMode: =If(IsBlank(Trim(Coalesce(gblRecipient, ""))), DisplayMode.Disabled, DisplayMode.Edit)
                        OnSelect: =Set(gblManifestMode, "Recipient"); Set(gblManifestId, "MNF-" & Text(Now(), "[$-en-US]yyyymmdd-hhnnss") & "-" & Upper(Left(Substitute(Text(GUID()), "-", ""), 6))); Set(gblManifestPreparedAt, Now()); Navigate(PackingList, ScreenTransition.Fade)
                        Text: ="Print Recipient Custody List"
                  - btnClearScans_1:
                      Control: FluentV8/Button@1.5.13
                      Properties:
                        AccessibleLabel: ="Clear recent scans from this local session"
                        LayoutMinHeight: =32
                        OnSelect: |
                          =If(
                              CountRows(
                                  Filter(
                                      colRecentScans,
                                      Direction = "Inbound" &&
                                      !IsBlank(TrackingId) &&
                                      (IsBlank(gblLastInboundManifestPrintedAt) || Timestamp > gblLastInboundManifestPrintedAt)
                                  )
                              ) > 0 && !varConfirmClearScans,
                              UpdateContext({varConfirmClearScans: true});
                              Notify("This session contains unprinted inbound records. Select Clear again within 8 seconds to confirm.", NotificationType.Warning),
                              Clear(colRecentScans);
                              UpdateContext({varConfirmClearScans: false});
                              Notify("The local scan ledger was cleared.", NotificationType.Success)
                          )
                        Text: =If(varConfirmClearScans, "Confirm Clear Unprinted Ledger", "Clear Local Ledger (" & CountRows(colRecentScans) & ")")
                  - tmrClearScansConfirmation:
                      Control: Timer@2.1.0
                      Properties:
                        Duration: =8000
                        OnTimerEnd: |-
                          =UpdateContext({varConfirmClearScans: false})
                        Start: =varConfirmClearScans
                        Visible: =false
                  - tmrVoidConfirmation:
                      Control: Timer@2.1.0
                      Properties:
                        Duration: =8000
                        OnTimerEnd: |-
                          =UpdateContext({varPendingVoidTrackingId: Blank()})
                        Start: =!IsBlank(varPendingVoidTrackingId)
                        Visible: =false
                  - tmrFocusScanner_1:
                      Control: Timer@2.1.0
                      Properties:
                        Duration: =50
                        OnTimerEnd: |
                          =UpdateContext({varTriggerFocus: false});
                          SetFocus(txtBarcodeScanner_2);
                        Start: =varTriggerFocus
                        Visible: =false
